name: Validate Code Analyzer

on:
  pull_request:
    branches:
      - Full1
      - Full2

jobs:
  code-analyzer-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Code Analyzer plugin
        run: echo "y" | sf plugins install @salesforce/sfdx-scanner@latest

      - name: Get changed Apex files
        run: |
          FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD \
            | grep -E '\.(cls|trigger)$' \
            | tr '\n' ',' \
            | sed 's/,$//')

          echo "CHANGED_FILES=$FILES" >> $GITHUB_ENV

      - name: Run Code Analyzer
        if: env.CHANGED_FILES != ''
        run: |
          sf scanner run \
            --target "${{ env.CHANGED_FILES }}" \
            --format json \
            --outfile results.json \
            --normalize-severity \
            --pmdconfig ${{ github.workspace }}/apex-ruleset.xml

      - name: Validate changed-line violations
        if: env.CHANGED_FILES != ''
        run: |
          python .github/scripts/filter_changed_lines.py \
            "${{ github.event.pull_request.base.ref }}"
