name: Salesforce Code Analysis (Diff Aware)

on:
  pull_request:
    branches:
      - Full1
      - Full2

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Code Analyzer
        run: sf plugins install @salesforce/sfdx-scanner

      # -------------------------------
      # 1. Get changed Apex files
      # -------------------------------
      - name: Get changed files
        id: files
        run: |
          git fetch origin ${{ github.base_ref }}

          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '\.(cls|trigger)$' || true > changed.txt

          echo "Changed files:"
          cat changed.txt

      # -------------------------------
      # 2. Get changed lines (diff)
      # -------------------------------
      - name: Get changed line numbers
        run: |
          git diff -U0 origin/${{ github.base_ref }}...HEAD \
            | grep -E "^\+[^+]" > diff.txt || true

          echo "Changed lines captured"

      # -------------------------------
      # 3. Run Code Analyzer
      # -------------------------------
      - name: Run Code Analyzer
        if: success()
        run: |
          sf code-analyzer run \
            --target force-app \
            --format sarif \
            --outfile report.sarif

      # -------------------------------
      # 4. Validate only changed lines
      # -------------------------------
      - name: Fail if violations on changed lines
        run: |
          node << 'EOF'
          const fs = require("fs");

          const sarif = JSON.parse(fs.readFileSync("report.sarif", "utf8"));
          const diff = fs.readFileSync("diff.txt", "utf8");

          // Extract changed line numbers per file
          const changedLines = {};

          diff.split("\n").forEach(line => {
            const match = line.match(/^\+(\d+)/);
            if (match) {
              const lineNum = parseInt(match[1], 10);
              // NOTE: simplified mapping (can be enhanced per file)
              changedLines[lineNum] = true;
            }
          });

          let failed = false;

          for (const run of sarif.runs || []) {
            for (const result of run.results || []) {
              const loc = result.locations?.[0]?.physicalLocation;
              if (!loc) continue;

              const line = loc.region?.startLine;

              if (changedLines[line]) {
                console.log("❌ Issue on changed line:", result.message.text, "Line:", line);
                failed = true;
              }
            }
          }

          if (failed) {
            console.error("\nPR failed: Issues found in modified lines only.");
            process.exit(1);
          } else {
            console.log("\n✅ No issues found in modified lines.");
          }
          EOF

      # -------------------------------
      # 5. Upload SARIF
      # -------------------------------
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
