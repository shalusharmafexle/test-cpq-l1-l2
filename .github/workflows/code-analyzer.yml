name: Salesforce Incremental Code Analyzer

on:
  pull_request:
    branches:
      - Full1
      - Full2

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug workspace (safe remove later)
        run: ls -R

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Code Analyzer Plugin
        run: sf plugins install code-analyzer --force

      # ✅ FIXED PATH HERE
      - name: Generate changed lines
        run: python ./scripts/get_changed_lines.py

      - name: Run Salesforce Code Analyzer
        run: |
          sf code-analyzer run \
            --target force-app \
            --output-format json \
            --output-file results.json

      - name: Filter Results
        run: python ./scripts/filter_results.py
