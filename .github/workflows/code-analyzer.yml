name: Salesforce Code Analyzer - PR Validation

on:
  pull_request:
    branches:
      - Full1
      - Full2

jobs:
  code-analysis:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js (required for Salesforce CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      # Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      # Install Salesforce Code Analyzer plugin
      - name: Install Code Analyzer
        run: sf plugins install "@salesforce/code-analyzer"

      # Fetch base branch to compare changes
      - name: Fetch base branch
        run: git fetch origin Full2

      # Identify changed Apex classes between PR branch and base branch
      - name: Get changed Apex classes
        run: |
          git diff --name-only origin/Full2...HEAD | grep "classes/.*\.cls" > changed_classes.txt || true

      # Run analyzer only on changed files
      - name: Run Salesforce Code Analyzer
        run: |
          if [ -s changed_classes.txt ]; then
            echo "Running analyzer on changed classes:"
            cat changed_classes.txt
            xargs sf code-analyzer run --target < changed_classes.txt
          else
            echo "No Apex class changes detected."
          fi
