name: Validate Code Analyzer

on:
  pull_request:
    branches:
      - Full1
      - Full2

jobs:
  code-analyzer-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to fetch all branches and commits

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Salesforce Code Analyzer Plugin
        run: echo 'y' | sf plugins install @salesforce/sfdx-scanner@latest

      - name: Run Salesforce Code Analyzer (delta mode)
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-command: run
          run-arguments: --normalize-severity --target "force-app/main/default/classes/" --delta --pmdconfig apex-ruleset.xml --outfile results.html
          results-artifact-name: salesforce-code-analyzer-results

      - name: Check the outputs to determine whether to fail
        if: |
          steps.run-code-analyzer.outputs.exit-code > 0 ||
          steps.run-code-analyzer.outputs.num-sev1-violations > 0 ||
          steps.run-code-analyzer.outputs.num-violations > 0
        run: exit 1
