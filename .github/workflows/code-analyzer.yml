name: Validate Code Analyzer

on:
  pull_request:
    branches:
      - Full1
      - Full2

jobs:
  code-analyzer-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Install Salesforce Code Analyzer Plugin
        run: echo 'y' | sf plugins install @salesforce/sfdx-scanner@latest

      - name: Get changed Apex files
        id: changed-files
        run: |
          echo "CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/${{ github.event.pull_request.base.ref }} | grep -E '\.(cls|trigger)$' | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_ENV

      - name: Run Salesforce Code Analyzer on changed files
        if: env.CHANGED_FILES != ''
        run: |
          sf scanner run \
            --normalize-severity \
            --target $CHANGED_FILES \
            --pmdconfig apex-ruleset.xml \
            --json \
            --outfile results.json

      - name: Extract changed line ranges
        if: env.CHANGED_FILES != ''
        run: |
          git diff --unified=0 origin/${{ github.event.pull_request.base.ref }} -- $CHANGED_FILES | grep '^@@' > hunks.txt

      - name: Filter analyzer results to changed lines
        if: env.CHANGED_FILES != ''
        run: |
          python3 <<'EOF'
          import json, re, sys
          # Load analyzer results
          with open("results.json") as f:
              data = json.load(f)

          # Load diff hunks
          hunks = []
          with open("hunks.txt") as f:
              for line in f:
                  m = re.match(r"@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@", line)
                  if m:
                      start = int(m.group(1))
                      length = int(m.group(2) or 1)
                      hunks.append(range(start, start+length))

          changed_lines = set(l for r in hunks for l in r)

          violations_in_changed = []
          for v in data.get("violations", []):
              if v.get("line") in changed_lines:
                  violations_in_changed.append(v)

          if violations_in_changed:
              print("Violations in changed lines:", violations_in_changed)
              sys.exit(1)
          else:
              print("No violations in changed lines.")
          EOF
