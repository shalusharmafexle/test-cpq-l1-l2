name: Salesforce Code Analyzer (PR Diff Safe)

on:
  pull_request:
    branches:
      - Full1
      - Full2

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # Checkout full history (required for diff)
      # -------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------
      # Install Salesforce CLI + Code Analyzer
      # -------------------------------
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Code Analyzer plugin
        run: sf plugins install @salesforce/sfdx-scanner

      # -------------------------------
      # Fetch base branch
      # -------------------------------
      - name: Fetch base branch
        run: |
          BASE_BRANCH=${{ github.event.pull_request.base.ref }}
          echo "Base branch: $BASE_BRANCH"
          git fetch origin $BASE_BRANCH --depth=0

      # -------------------------------
      # Get changed Apex files (SAFE + STABLE)
      # -------------------------------
      - name: Get changed files
        id: files
        run: |
          BASE_BRANCH=${{ github.event.pull_request.base.ref }}

          BASE_SHA=$(git merge-base HEAD origin/$BASE_BRANCH)

          echo "Base SHA: $BASE_SHA"

          CHANGED_FILES=$(git diff --name-only $BASE_SHA HEAD)

          # Keep only Apex files
          CHANGED_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(cls|trigger)$' || true)

          echo "Changed Apex files:"
          echo "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Apex changes detected"
            echo "files=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # -------------------------------
      # Run Code Analyzer (single run, no overwrite issues)
      # -------------------------------
      - name: Run Code Analyzer
        if: steps.files.outputs.files != ''
        run: |
          FILES="${{ steps.files.outputs.files }}"

          echo "Running analysis on:"
          echo "$FILES"

          sf code-analyzer run \
            --target "$FILES" \
            --format sarif \
            --outfile report.sarif

      # -------------------------------
      # Upload SARIF to GitHub
      # -------------------------------
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
